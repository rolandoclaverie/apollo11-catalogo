# Robot del repositorio PÚBLICO de fotos del catálogo (lo copia catalogo/catalogo.py a
# .github/workflows/ofertas.yml de rolandoclaverie/apollo11-catalogo; NO editar allá).
# Cada hora deja visible solo la oferta del día en catalogo.csv (ajustar_ofertas.py), así
# el cambio de día ocurre aunque el notebook esté apagado. Meta lee la lista cada hora.
name: Ofertas del dia
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dejar visible solo la oferta de hoy
        run: python3 ajustar_ofertas.py catalogo.csv feriados.txt
      - name: Subir si cambio
        run: |
          if [ -n "$(git status --porcelain catalogo.csv)" ]; then
            git config user.name "robot-ofertas"
            git config user.email "robot-ofertas@users.noreply.github.com"
            git add catalogo.csv
            git commit -m "Ofertas del dia"
            git pull --rebase
            git push
          fi
